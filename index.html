<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="digest-version" content="v3-calm">
<title>一丹的西雅图活动radar · 10/11–10/17</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#fafaf7;color:#2d3436;font-size:17px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;font-weight:600;margin:0}
.sub{color:#8a9097;font-size:15px;margin:4px 0 18px}
.picks{background:#eef4f1;border-radius:14px;padding:14px 16px;font-size:16px;color:#2f5d50;margin-bottom:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#eceae4;color:#555;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer}
.chip.on{background:#3d6b5e;color:#fff}
details.more{margin:6px 0 20px}details.more summary{color:#3d6b5e;font-size:15px;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.panel{margin-top:12px;display:grid;gap:12px;font-size:15px;background:#fff;border-radius:14px;padding:16px;border:1px solid #eee}
.panel input[type=search],.panel input[type=number],.panel select{font-size:15px;padding:8px 10px;border:1px solid #ddd;border-radius:10px;background:#fff;width:100%}
.panel label{display:flex;align-items:center;gap:8px}
.panel .r{display:flex;gap:10px}.panel .r>*{flex:1}
.reset{border:0;background:none;color:#b0574a;font-size:15px;text-align:left;padding:0;cursor:pointer}
.count{color:#8a9097;font-size:14px;margin:0 0 10px}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1px solid #efede8;cursor:pointer}
.l1{display:flex;align-items:baseline;gap:10px}
.when{color:#3d6b5e;font-size:14px;font-weight:600;flex:none;min-width:76px}
.title{font-weight:600;flex:1}
.ic{font-size:12px;font-weight:700;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic.ok{background:#e3f1e8;color:#2f7a4f}.ic.warn{background:#fbeee2;color:#b8691d}
.l2{display:flex;justify-content:space-between;align-items:center;color:#8a9097;font-size:14px;margin-top:4px;padding-left:86px}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;flex:none}
.首选{background:#e8f0ec;color:#2f5d50}.推荐{background:#eaf0f6;color:#3b5f80}.低优先{background:#f1f1ef;color:#888}.冲突{background:#fbeee2;color:#b8691d}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #f0eee9;font-size:15px;color:#555}
.card.open .det{display:block}.det p{margin:4px 0}
.star{border:0;background:none;font-size:15px;color:#3d6b5e;padding:0;cursor:pointer;margin-top:6px}
.src{font-size:12px;color:#aaa;word-break:break-all}.src a{color:#aaa}
.empty{color:#aaa;text-align:center;padding:30px 0}
</style></head><body><div class="wrap">
<h1>一丹的西雅图活动radar</h1><div class="sub">10/11 周日 – 10/17 周六</div>
<div class="picks">⭐ EVAN《Death of Me》周一 · TEN《OUTWEST》周二 · FRACTURE! 数学鬼屋 周六晚</div>
<div class="chips" id="cats"></div><div class="chips" id="days"></div>
<details class="more"><summary>更多筛选 ▾</summary><div class="panel">
<input type="search" id="q" placeholder="搜索歌名、老师、地点">
<div class="r"><select id="area"><option value="">所有区域</option><option>Eastside</option><option>Seattle</option></select>
<select id="sort"><option value="time">按时间</option><option value="rank">按优先级</option></select></div>
<input type="number" id="mp" min="0" placeholder="最高价格 $（不限）">
<label><input type="checkbox" id="hc">隐藏冲突</label>
<label><input type="checkbox" id="fo">只看收藏</label>
<label><input type="checkbox" id="sk">显示「可以略过」</label>
<button class="reset" id="rs">重置全部</button></div></details>
<div class="count" id="cnt"></div><div id="list"></div>
<p class="src" style="margin-top:24px">「!」= 时间待核实或与日程冲突（Coffee Dance 时间未经官网确认，订课前请核对）· 「✓」= 已订</p>
</div><script>
const DAYS=["周日","周一","周二","周三","周四","周五","周六"],SD=["日","一","二","三","四","五","六"],DATES=["10/11","10/12","10/13","10/14","10/15","10/16","10/17"];
const RANK={首选:0,推荐:1,低优先:2,冲突:3};
const CATS=[["","全部"],["舞蹈课","舞蹈"],["AI 活动","AI"],["当季活动","活动"],["K-pop 演唱会","演唱会"]];
const CD="https://www.coffeedance.org/book-online";
const DATA=[
{id:"evan",cat:"舞蹈课",title:"《Death of Me》— EVAN",days:[1],start:"19:45",time:"7:45–9:15 PM",place:"Coffee Dance，12021 Northup Way Ste 202, Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 2、chorus｜Rue",verdict:"首选",verify:true,desc:"男 solo，重点练 isolation、细腻 groove 和控制力，正好是你喜欢的男 solo 质感路线。周一完全空，Eastside 过去也方便。",src:CD},
{id:"ten",cat:"舞蹈课",title:"《OUTWEST》— TEN",days:[2],start:"19:10",time:"7:10–8:40 PM",place:"Coffee Dance，Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 2、chorus｜Mia",verdict:"首选",verify:true,desc:"男 solo，融合 hip-hop 和 R&B 的 groove，讲究 texture 和舞台气质。另有一节 Level 2–3、Last chorus 的 OUTWEST（Mia，时间未注明），学过 chorus 可以接着学。",src:CD},
{id:"kiss",cat:"舞蹈课",title:"Original Heels《Kiss It Better》— Rihanna",days:[3],start:"19:45",time:"7:45–9:15 PM",place:"Coffee Dance，Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 2｜Jennie",verdict:"推荐",booked:true,desc:"已经在你的日程里了，不用再订。",src:CD},
{id:"grls",cat:"舞蹈课",title:"《GRLS》— TUIDE",days:[4],start:"19:10",time:"7:10 PM",place:"Coffee Dance，Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 2｜Isha",verdict:"冲突",verify:true,clash:true,desc:"和你 7:00–8:30 在 Tina's 的 Intermediate Jazz 冲突，所以不推荐。",src:CD},
{id:"goodboy",cat:"舞蹈课",title:"《Good Boy》— &TEAM",days:[],place:"Coffee Dance，Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 2、Chorus 2｜Rue",verdict:"低优先",desc:"男团，适合练力量和整齐度。只有学过 chorus 1，或者很喜欢这首歌才值得去。",src:CD},
{id:"eyes",cat:"舞蹈课",title:"Original Heels《Eyes on Fire》",days:[],place:"Coffee Dance，Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 1–2｜Jennie",verdict:"低优先",desc:"原创 Heels 课，级别偏入门。你这周已经有两节 Heels 了，可以放在后面考虑。",src:CD},
{id:"party",cat:"舞蹈课",title:"Original Jazz Funk《Party 4 U》",days:[],place:"Coffee Dance，Bellevue",area:"Eastside",price:23,priceText:"$23",level:"Level 1–2｜JN",verdict:"低优先",desc:"原创 Jazz Funk 课。",src:CD},
{id:"ai",cat:"AI 活动",title:"Games & AI Demo Night（AI Tinkerers）",days:[3],start:"17:00",time:"5–8 PM",place:"Seattle（地点只发给通过审核的人）",area:"Seattle",price:0,priceText:"免费，需申请",level:"—",verdict:"冲突",clash:true,desc:"有 AI-native 游戏和 AI 辅助内容生产的 lightning demo，还有可以上手玩的 demo 桌，由 AWS 和 Metal Toad 赞助。和你 6:00 在 Tina's 的 Hip-hop Foundation 冲突，只能 5:00 到场待一会儿。申请不代表录取。",src:"https://seattle.aitinkerers.org/p/games-ai-demo-night-october-14th"},
{id:"fracture",cat:"当季活动",title:"FRACTURE! Matheatre Haunted House",days:[4,5,6],start:"19:00",time:"After Dark 7–10 PM（持续到 10/25）",place:"Pacific Science Center，Seattle Center",area:"Seattle",price:10,priceText:"$10–$40 自选，可现场买票",level:"—",verdict:"首选",desc:"把数学解谜、鬼屋、逃脱房和现场戏剧混在一起，每 15 分钟进一组。周六 6:30 下课后去最合适。周四和 Jazz 课冲突，周五 7:30 下课后赶过去会比较紧。",src:"https://pacificsciencecenter.org/events/fracture/"},
{id:"svgo",cat:"当季活动",title:"Seattle Video Game Orchestra 小组音乐会",days:[6],start:"18:00",time:"6–7 PM（5:30 开门）",place:"St Elizabeth's Episcopal Church, Burien",area:"Seattle",price:0,priceText:"免费，不用预约，有免费停车",level:"—",verdict:"冲突",clash:true,desc:"曲目包括原神、FF X、Silksong 等。和你 5:00–6:30 的 Intermediate Choreography 冲突，地点也远。",src:"https://www.eventbrite.com/e/seattle-video-game-orchestra-fall-small-group-concert-2026-registration-2001433709101"},
{id:"cc",cat:"当季活动",title:"Consoles & Cardboard",days:[0],start:"14:00",time:"2–9 PM",place:"Stoup Brewing Capitol Hill",area:"Seattle",price:null,priceText:"未注明",level:"—",verdict:"低优先",desc:"有电子游戏、桌游、VR 和 Switch 多人游戏。周日你下午和傍晚都有课，地点又在 Capitol Hill。",src:"https://momentsapp.no/event/99cdc39e-d17c-4f09-8ae8-6d5266558677"},
{id:"prseries",cat:"可以略过",title:"PopRox 8 周系列课",days:[1,3,5],start:"20:30",time:"周一 Hip Hop Fusion / 周三 Dance After Dark / 周五 Beginner Burlesque，均 8:30–10 PM",place:"PopRox Capitol Hill",area:"Seattle",price:360,priceText:"$360",level:"见各系列",verdict:"低优先",desc:"都要长期出勤。本周 PopRox 也没找到可以单次报名的 K-pop 或 Heels 课。",src:"https://www.poproxdance.com/adultseries"},
{id:"jaguar",cat:"可以略过",title:"PopRox Beginner Heels《Jaguar》— Victoria Monét",days:[6],start:"10:00",time:"10–11:30 AM（8 周系列，10/17 开始）",place:"PopRox U-District",area:"Seattle",price:360,priceText:"$360",level:"Beginner｜May Qiang",verdict:"低优先",desc:"入门级，你已经超过这个水平了。",src:"https://www.poproxdance.com/adultseries"},
{id:"japan",cat:"可以略过",title:"Japan Week（Bellevue College）",days:[],place:"Bellevue College",area:"Eastside",price:0,priceText:"免费",level:"—",verdict:"低优先",desc:"只在 10/10，已经过了。",src:"https://studentweb.bellevuecollege.edu/japan-week/2026-saturday-schedule/"}
];
let S={cat:"",day:null,q:"",area:"",sort:"time",mp:"",hc:false,fo:false,sk:false};
let favs=new Set(JSON.parse(localStorage.getItem("sdFavs")||"[]")),open=new Set();
const p=new URLSearchParams(decodeURIComponent(location.hash.slice(1)));if(p.get("cat"))S.cat=p.get("cat");if(p.get("day"))S.day=+p.get("day");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(){cats.innerHTML=CATS.map(([v,l])=>`<button class="chip ${S.cat===v?"on":""}" data-cat="${v}">${l}</button>`).join("");
 days.innerHTML=`<button class="chip ${S.day===null?"on":""}" data-day="">全部</button>`+SD.map((d,i)=>`<button class="chip ${S.day===i?"on":""}" data-day="${i}">${d} ${DATES[i].slice(3)}</button>`).join("")}
function ok(d){if(d.cat==="可以略过"?!(S.sk||S.cat==="可以略过"):false)return false;
 if(S.cat&&d.cat!==S.cat)return false;if(S.day!==null&&!d.days.includes(S.day))return false;
 if(S.area&&d.area!==S.area)return false;if(S.hc&&(d.clash||d.verdict==="冲突"))return false;if(S.fo&&!favs.has(d.id))return false;
 if(S.mp!==""&&(d.price===null||d.price>+S.mp))return false;
 if(S.q&&![d.title,d.place,d.level,d.desc].join(" ").toLowerCase().includes(S.q.toLowerCase()))return false;return true}
const fd=d=>S.day!==null?S.day:(d.days.length?d.days[0]:7);
function when(d){const ds=d.days.length?d.days.map(i=>SD[i]).join("/"):"时间未注明";const t=d.start?(" "+(+d.start.slice(0,2)%12||12)+":"+d.start.slice(3)):"";return d.days.length?"周"+ds+t:ds}
function card(d){const ic=d.booked?'<span class="ic ok" title="已订">✓</span>':(d.clash||d.verify)?`<span class="ic warn" title="${d.clash?"与日程冲突":"时间待核实"}">!</span>`:"";
 return `<div class="card ${open.has(d.id)?"open":""}" data-id="${d.id}"><div class="l1"><span class="when">${when(d)}</span><span class="title">${esc(d.title)}</span>${ic}</div>
<div class="l2"><span>${esc(d.place.split("，")[0])} · ${esc(d.priceText.split("，")[0])}</span><span class="badge ${d.verdict}">${d.verdict}</span></div>
<div class="det"><p>${d.days.map(i=>DAYS[i]+" "+DATES[i]).join("、")||"时间未注明"}${d.time?" · "+esc(d.time):""}</p><p>${esc(d.place)}</p><p>${esc(d.priceText)}${d.level!=="—"?" · "+esc(d.level):""}</p>
${d.booked?"<p>✓ 已订</p>":""}${d.clash?"<p>! 与日程冲突</p>":""}${d.verify?"<p>! 时间待核实</p>":""}<p>${esc(d.desc)}</p>
<button class="star" data-star="${d.id}">${favs.has(d.id)?"★ 已收藏":"☆ 收藏"}</button><p class="src">来源：<a href="${d.src}" target="_blank" rel="noopener">${esc(d.src.replace(/^https?:\/\//,"").slice(0,44))}</a></p></div></div>`}
function render(){chips();const it=DATA.filter(ok);
 it.sort(S.sort==="rank"?(a,b)=>RANK[a.verdict]-RANK[b.verdict]||fd(a)-fd(b):(a,b)=>fd(a)-fd(b)||(a.start||"").localeCompare(b.start||""));
 cnt.textContent=`${it.length} 项`;
 list.innerHTML=it.length?it.map(card).join(""):`<div class="empty">${S.cat==="K-pop 演唱会"?"本周暂无演唱会":"没有符合条件的活动"}</div>`}
cats.onclick=e=>{const b=e.target.closest("[data-cat]");if(b){S.cat=b.dataset.cat;render()}};
days.onclick=e=>{const b=e.target.closest("[data-day]");if(b){S.day=b.dataset.day===""?null:+b.dataset.day;render()}};
q.oninput=()=>{S.q=q.value;render()};mp.oninput=()=>{S.mp=mp.value;render()};area.onchange=()=>{S.area=area.value;render()};sort.onchange=()=>{S.sort=sort.value;render()};
hc.onchange=()=>{S.hc=hc.checked;render()};fo.onchange=()=>{S.fo=fo.checked;render()};sk.onchange=()=>{S.sk=sk.checked;render()};
rs.onclick=()=>{S={cat:"",day:null,q:"",area:"",sort:"time",mp:"",hc:false,fo:false,sk:false};q.value=mp.value=area.value="";sort.value="time";hc.checked=fo.checked=sk.checked=false;render()};
list.onclick=e=>{if(e.target.closest("a"))return;const s=e.target.closest("[data-star]");
 if(s){const id=s.dataset.star;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("sdFavs",JSON.stringify([...favs]));render();return}
 const c=e.target.closest(".card");if(c){const id=c.dataset.id;open.has(id)?open.delete(id):open.add(id);c.classList.toggle("open")}};
render();
</script></body></html>
